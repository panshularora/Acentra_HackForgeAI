[project]
name = "claimswatch"
version = "0.1.0"
description = "Real-time log anomaly detection for Medicaid claims services"
license = { text = "MIT" }
authors = [{ name = "Panshul Arora" }]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "boto3>=1.34",
    "pydantic-settings>=2.4",
    "drain3==0.9.11",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "moto[server,sns,sqs,logs]>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "boto3-stubs[sns,sqs,logs]>=1.34",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "../tools"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = ["ignore:Using .httpx. with .starlette.testclient."]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["."]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "N", "C4", "PTH"]

[tool.ruff.lint.isort]
known-first-party = ["app", "benchmark", "loggen", "replay"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]
