# One-command local stack: AWS emulator, backend, log generator and dashboard.
#
#   docker compose up --build
#   open http://localhost:5173
#
# Host ports default to 5173 (dashboard), 8000 (API) and 5000 (moto). If one is
# taken, override it, e.g. FRONTEND_PORT=8080 BACKEND_PORT=18000 docker compose up --build
#
# Inject incidents into the running log generator:
#   docker compose exec loggen python tools/loggen.py --incident db-outage --duration 45
#   docker compose exec loggen python tools/loggen.py --incident cred-stuffing --duration 30
#   docker compose exec loggen python tools/loggen.py --incident new-error --duration 45
#   docker compose exec loggen python tools/loggen.py --incident heartbeat-stop --duration 60
#   docker compose exec loggen python tools/loggen.py --incident flow-break --duration 60
#
# Read alerts back from SNS:
#   docker compose exec backend python tools/sns_tail.py
#
# Stop and remove containers and volumes:
#   docker compose down -v

name: claimswatch

services:
  moto:
    # Local AWS emulator (SNS, SQS, CloudWatch Logs). No AWS account needed.
    image: motoserver/moto:5.2.3
    ports:
      - "${MOTO_PORT:-5000}:5000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://127.0.0.1:5000/moto-api/"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: claimswatch-backend
    environment:
      AWS_ENDPOINT_URL: http://moto:5000
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: testing
      AWS_SECRET_ACCESS_KEY: testing
      CORS_ORIGINS: '["http://localhost:${FRONTEND_PORT:-5173}"]'
    volumes:
      - logs:/app/logs
      - data:/app/data
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    depends_on:
      moto:
        condition: service_healthy

  loggen:
    # Reuses the backend image; writes normal claims traffic to the shared volume.
    image: claimswatch-backend
    pull_policy: never
    command: ["python", "tools/loggen.py", "--rate", "40"]
    healthcheck:
      disable: true
    volumes:
      - logs:/app/logs
    depends_on:
      backend:
        condition: service_healthy

  frontend:
    # Built dashboard served by nginx, which proxies /api and /ws to "backend".
    build: ./frontend
    image: claimswatch-frontend
    ports:
      - "${FRONTEND_PORT:-5173}:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  logs:
  data:
